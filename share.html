         class="w-full py-3.5 rounded-full bg-white text-black font-bold text-xs flex items-center justify-center gap-2 active:scale-95 transition-all shadow-lg shadow-white/10">

  <script>
    // 1. Supabase 클라이언트 설정 (변수명을 supabaseClient로 분리하여 전역 충돌 완벽 방지)
    const SUPABASE_URL = 'https://djmdzsbfsobsutphragw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqbWR6c2Jmc29ic3V0cGhyYWd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4ODQ3NTgsImV4cCI6MjEwNTQ2MDc1OH0.BC7llaSjbq6cYhDlRqrwJaycpQ6gSNcp5LgYBeM6WEM';
    let supabaseClient = null;
    try {
      const sbFactory = window.supabase || window.Supabase;
      if (sbFactory && typeof sbFactory.createClient === 'function') {
        supabaseClient = sbFactory.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.warn("Supabase 초기화 경고:", e);
    }

    // 🌟 잘린 유니코드 조각(Lone Surrogate) 및 깨진 대체 문자(, \uFFFD)를 깔끔하게 제거하는 헬퍼
    function sanitizeCleanText(str) {
      if (!str) return "";
      return String(str)
        .replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])/g, '')
        .replace(/(?:[^\uD800-\uDBFF]|^)[\uDC00-\uDFFF]/g, function(m) { return m.length > 1 ? m[0] : ''; })
        .replace(/\uFFFD/g, '')
        .trim();
    }

    // 🌟 날개 모양(shape) 값을 실제 3D .glb 파일명과 1:1 매칭되도록 정규화하는 헬퍼
    function normalizeButterflyShape(rawShape) {
      const s = String(rawShape || 'crescent').trim().toLowerCase();
      if (s === 'crescent' || s.indexOf('초승') > -1) return 'crescent';
      if (s === 'dawn-ray' || s === 'dawn' || s === 'dawn_ray' || s.indexOf('새벽') > -1) return 'dawn-ray';
      if (s === 'ember' || s.indexOf('불꽃') > -1) return 'ember';
      if (s === 'moon-halo' || s === 'moon' || s === 'moon_halo' || s.indexOf('달무리') > -1) return 'moon-halo';
      if (s === 'petal' || s.indexOf('산들') > -1) return 'petal';
      if (s === 'starlight' || s.indexOf('별빛') > -1) return 'starlight';
      if (s === 'wave-fin' || s === 'wave' || s === 'wave_fin' || s.indexOf('물결') > -1) return 'wave-fin';
      return 'crescent';
    }

    // 2. URL 파라미터 기본값
    const urlParams = new URLSearchParams(window.location.search);
    const butterflyId = urlParams.get('id');
    const hasUrlName = urlParams.has('name');
    let butterflyName = sanitizeCleanText(urlParams.get('name')) || "빛의 나비";
    let memoText = sanitizeCleanText(urlParams.get('memo')) || "너의 찬란한 날갯짓을 응원해.";
    let shape = normalizeButterflyShape(urlParams.get('shape') || "crescent");
    let patternId = urlParams.get('pattern') || null;
    let rawAntennaParam = urlParams.get('antenna') || "ball";
    let parsedAntParts = String(rawAntennaParam).split('__');
    let antennaType = parsedAntParts[0] || "ball";
    let bodyColor = urlParams.get('body') || parsedAntParts[1] || "white";
    let textureUrl = urlParams.get('texture') || null;

    function escapeHtmlSafe(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function updateUIElements() {
      const titleEl = document.getElementById('share-title-text');
      if (titleEl) {
        titleEl.innerHTML = `'${escapeHtmlSafe(butterflyName)}'이(가)<br>도착했습니다`;
      }
      const memoEl = document.getElementById('share-memo-text');
      if (memoEl) {
        memoEl.innerText = `"${memoText}"`;
      }
    }

    // 🌟 짧은 주소(?id=번호)로 접속했을 때는 DB에서 이름을 받아온 직후 표시하여 초기 깜빡임 방지
    if (hasUrlName || !butterflyId) {
      updateUIElements();
    } else {
      const titleEl = document.getElementById('share-title-text');
      const memoEl = document.getElementById('share-memo-text');
      if (titleEl) titleEl.innerHTML = `나비가<br>도착했습니다`;
      if (memoEl) memoEl.innerText = `""`;
    }

    function createFallbackTexture(color1, color2) {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 1024;
      const ctx = c.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 1024, 1024);
      grad.addColorStop(0, color1 || '#fdfbfb');
      grad.addColorStop(1, color2 || '#ebedee');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1024);
      return c.toDataURL('image/png');
    }

    function executeReliableFastBlur(canvas, radius) {
      if (radius <= 0.2) return;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const w = canvas.width, h = canvas.height;
      const imgData = ctx.getImageData(0, 0, w, h);
      const src = imgData.data;
      const r = Math.max(1, Math.round(radius)), kernelSize = r * 2 + 1;
      const temp = new Uint8ClampedArray(src.length);

      for (let y = 0; y < h; y++) {
        let rowStart = y * w * 4, rSum = 0, gSum = 0, bSum = 0, aSum = 0;
        for (let i = -r; i <= r; i++) {
          let px = Math.min(w - 1, Math.max(0, i)), pIndex = rowStart + px * 4;
          rSum += src[pIndex]; gSum += src[pIndex + 1]; bSum += src[pIndex + 2]; aSum += src[pIndex + 3];
        }
        for (let x = 0; x < w; x++) {
          let outIndex = rowStart + x * 4;
          temp[outIndex] = rSum / kernelSize; temp[outIndex + 1] = gSum / kernelSize; temp[outIndex + 2] = bSum / kernelSize; temp[outIndex + 3] = aSum / kernelSize;
          let remIdx = rowStart + Math.min(w - 1, Math.max(0, x - r)) * 4;
          let addIdx = rowStart + Math.min(w - 1, Math.max(0, x + r + 1)) * 4;
          rSum += src[addIdx] - src[remIdx]; gSum += src[addIdx + 1] - src[remIdx + 1]; bSum += src[addIdx + 2] - src[remIdx + 2]; aSum += src[addIdx + 3] - src[remIdx + 3];
        }
      }

      for (let x = 0; x < w; x++) {
        let rSum2 = 0, gSum2 = 0, bSum2 = 0, aSum2 = 0;
        for (let i = -r; i <= r; i++) {
          let py = Math.min(h - 1, Math.max(0, i)), pIndex2 = (py * w + x) * 4;
          rSum2 += temp[pIndex2]; gSum2 += temp[pIndex2 + 1]; bSum2 += temp[pIndex2 + 2]; aSum2 += temp[pIndex2 + 3];
        }
        for (let y = 0; y < h; y++) {
          let outIndex2 = (y * w + x) * 4;
          src[outIndex2] = rSum2 / kernelSize; src[outIndex2 + 1] = gSum2 / kernelSize; src[outIndex2 + 2] = bSum2 / kernelSize; src[outIndex2 + 3] = aSum2 / kernelSize;
          let remIdx2 = (Math.min(h - 1, Math.max(0, y - r)) * w + x) * 4;
          let addIdx2 = (Math.min(h - 1, Math.max(0, y + r + 1)) * w + x) * 4;
          rSum2 += temp[addIdx2] - temp[remIdx2]; gSum2 += temp[addIdx2 + 1] - temp[remIdx2 + 1]; bSum2 += temp[addIdx2 + 2] - temp[remIdx2 + 2]; aSum2 += temp[addIdx2 + 3] - temp[remIdx2 + 3];
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function get3DPatternPath(shapeKey, patId) {
      if (!patId || String(patId).indexOf('none') > -1) return null;
      const parts = String(patId).split('_');
      const patNum = parts[parts.length - 1] || "1";
      if (!/^[1-5]$/.test(patNum)) return null;

      const shapePrefix = normalizeButterflyShape(shapeKey);
      return './3DButterfly_pattern/' + shapePrefix + '_pattern_3D_' + patNum + '.png';
    }

    function createWingMaterials(texUrl, patPath) {
      const texLoader = new THREE.TextureLoader();
      texLoader.setCrossOrigin('anonymous');

      const photoTex = texLoader.load(texUrl, undefined, undefined, (err) => {
        console.warn("날개 텍스처 로드 실패, 폴백 사용:", err);
      });
      photoTex.flipY = false;
      photoTex.generateMipmaps = true;
      photoTex.minFilter = THREE.LinearMipmapLinearFilter;
      photoTex.magFilter = THREE.LinearFilter;
      photoTex.anisotropy = 4;
      if (THREE.sRGBEncoding) photoTex.encoding = THREE.sRGBEncoding;

      let patTex = null;
      let hasPat = false;
      if (patPath) {
        patTex = texLoader.load(patPath);
        patTex.flipY = false;
        patTex.generateMipmaps = true;
        patTex.minFilter = THREE.LinearMipmapLinearFilter;
        patTex.magFilter = THREE.LinearFilter;
        patTex.anisotropy = 4;
        if (THREE.sRGBEncoding) patTex.encoding = THREE.sRGBEncoding;
        hasPat = true;
      }

      function createCustomWingShader() {
        return new THREE.ShaderMaterial({
          uniforms: {
            photoMap: { value: photoTex },
            patMap: { value: patTex || new THREE.Texture() },
            hasPattern: { value: hasPat ? 1.0 : 0.0 }
          },
          vertexShader: [
            'varying vec2 vProjectedUv;',
            'varying vec2 vModelUv;',
            'void main() {',
            '  vModelUv = uv;',
            '  float u = (position.x + 2.4) / 4.8;',
            '  float v = (position.y + 2.4) / 4.8;',
            '  vProjectedUv = vec2(clamp(u, 0.0, 1.0), clamp(1.0 - v, 0.0, 1.0));',
            '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
            '}'
          ].join('\n'),
          fragmentShader: [
            'uniform sampler2D photoMap;',
            'uniform sampler2D patMap;',
            'uniform float hasPattern;',
            'varying vec2 vProjectedUv;',
            'varying vec2 vModelUv;',
            'void main() {',
            '  vec4 photoCol = texture2D(photoMap, vProjectedUv);',
            '  vec4 finalCol = photoCol;',
            '  if (hasPattern > 0.5) {',
            '    vec4 patCol = texture2D(patMap, vModelUv);',
            '    finalCol.rgb = mix(finalCol.rgb, finalCol.rgb * patCol.rgb, patCol.a * 0.95);',
            '  }',
            '  gl_FragColor = vec4(clamp(finalCol.rgb, 0.0, 1.0), finalCol.a);',
            '}'
          ].join('\n'),
          side: THREE.DoubleSide
        });
      }

      return { matL: createCustomWingShader(), matR: createCustomWingShader() };
    }

    function createBodyMaterial(texUrl, mode) {
      const targetMode = mode || 'white';

      if (targetMode === 'black') {
        return new THREE.MeshBasicMaterial({
          color: 0x000000,
          side: THREE.DoubleSide
        });
      }

      if (targetMode === 'blur') {
        const blurCanvas = document.createElement('canvas');
        blurCanvas.width = 256;
        blurCanvas.height = 256;
        const bctx = blurCanvas.getContext('2d', { willReadFrequently: true });
        bctx.fillStyle = '#d4d4d8';
        bctx.fillRect(0, 0, 256, 256);

        const photoTex = new THREE.CanvasTexture(blurCanvas);
        photoTex.flipY = false;
        photoTex.generateMipmaps = true;
        photoTex.minFilter = THREE.LinearMipmapLinearFilter;
        photoTex.magFilter = THREE.LinearFilter;
        if (THREE.sRGBEncoding) photoTex.encoding = THREE.sRGBEncoding;

        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() {
          bctx.drawImage(img, 0, 0, 256, 256);
          executeReliableFastBlur(blurCanvas, 18);
          executeReliableFastBlur(blurCanvas, 12);
          photoTex.needsUpdate = true;
        };
        img.src = texUrl || createFallbackTexture();

        return new THREE.ShaderMaterial({
          uniforms: {
            photoMap: { value: photoTex }
          },
          vertexShader: [
            'varying vec2 vProjectedUv;',
            'void main() {',
            '  float u = (position.x + 2.4) / 4.8;',
            '  float v = (position.y + 2.4) / 4.8;',
            '  vProjectedUv = vec2(clamp(u, 0.0, 1.0), clamp(1.0 - v, 0.0, 1.0));',
            '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
            '}'
          ].join('\n'),
          fragmentShader: [
            'uniform sampler2D photoMap;',
            'varying vec2 vProjectedUv;',
            'void main() {',
            '  vec4 sum = vec4(0.0);',
            '  float stepSize = 0.045;',
            '  sum += texture2D(photoMap, clamp(vProjectedUv + vec2(-stepSize, -stepSize), 0.0, 1.0)) * 0.0625;',
            '  sum += texture2D(photoMap, clamp(vProjectedUv + vec2(0.0, -stepSize), 0.0, 1.0)) * 0.125;',
            '  sum += texture2D(photoMap, clamp(vProjectedUv + vec2(stepSize, -stepSize), 0.0, 1.0)) * 0.0625;',
            '  sum += texture2D(photoMap, clamp(vProjectedUv + vec2(-stepSize, 0.0), 0.0, 1.0)) * 0.125;',
            '  sum += texture2D(photoMap, clamp(vProjectedUv, 0.0, 1.0)) * 0.25;',
            '  sum += texture2D(photoMap, clamp(vProjectedUv + vec2(stepSize, 0.0), 0.0, 1.0)) * 0.125;',
            '  sum += texture2D(photoMap, clamp(vProjectedUv + vec2(-stepSize, stepSize), 0.0, 1.0)) * 0.0625;',
            '  sum += texture2D(photoMap, clamp(vProjectedUv + vec2(0.0, stepSize), 0.0, 1.0)) * 0.125;',
            '  sum += texture2D(photoMap, clamp(vProjectedUv + vec2(stepSize, stepSize), 0.0, 1.0)) * 0.0625;',
            '  gl_FragColor = vec4(clamp(sum.rgb, 0.0, 1.0), 1.0);',
            '}'
          ].join('\n'),
          side: THREE.DoubleSide
        });
      }

      return new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
    }

    // 3D 뷰어 셋업
    const container = document.getElementById('share-three-container');
    const loadingIndicator = document.getElementById('loading-indicator');
    const w = container.clientWidth || 320;
    const h = container.clientHeight || 360;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
    camera.position.set(0, 0, 7.2);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    const ambLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(0, 5, 10);
    scene.add(dirLight);

    const group = new THREE.Group();
    const DEFAULT_ROT_X = 0;
    const DEFAULT_ROT_Y = 0;
    let butterflyRotX = DEFAULT_ROT_X;
    let butterflyRotY = DEFAULT_ROT_Y;
    let isUserDragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;

    // 🌟 처음 모습을 등(정면)이 보이도록 설정 (0, 0, 0)
    group.rotation.set(DEFAULT_ROT_X, DEFAULT_ROT_Y, 0);
    scene.add(group);

    // 🌟 메인 사이트(나비 날리기)와 동일한 360도 드래그 회전 인터랙션 바인딩
    function handlePointerStart(clientX, clientY) {
      isUserDragging = true;
      lastPointerX = clientX;
      lastPointerY = clientY;
    }

    function handlePointerMove(clientX, clientY) {
      if (!isUserDragging) return;
      const deltaX = clientX - lastPointerX;
      const deltaY = clientY - lastPointerY;
      butterflyRotY += deltaX * 0.013;
      butterflyRotX = Math.max(-1.4, Math.min(1.4, butterflyRotX + deltaY * 0.013));
      lastPointerX = clientX;
      lastPointerY = clientY;
    }

    function handlePointerEnd() {
      isUserDragging = false;
    }

    container.oncontextmenu = function(e) { e.preventDefault(); return false; };
    container.ontouchstart = function(e) {
      if (e.touches.length === 1) handlePointerStart(e.touches[0].clientX, e.touches[0].clientY);
    };
    window.addEventListener('touchmove', function(e) {
      if (isUserDragging && e.touches.length === 1) handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchend', handlePointerEnd, { passive: true });
    window.addEventListener('touchcancel', handlePointerEnd, { passive: true });

    container.onmousedown = function(e) { handlePointerStart(e.clientX, e.clientY); };
    window.addEventListener('mousemove', function(e) {
      if (isUserDragging) handlePointerMove(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', handlePointerEnd);

    let wingL = null, wingR = null;

    function build3DModel(targetShape, targetAnt, curTexUrl, curPatId, curBodyColor) {
      while (group.children.length > 0) {
        group.remove(group.children[0]);
      }
      wingL = null;
      wingR = null;

      const normalizedShape = normalizeButterflyShape(targetShape);
      const defaultCol1 = curBodyColor === 'black' ? '#000000' : '#fdfbfb';
      const defaultCol2 = curBodyColor === 'black' ? '#000000' : '#ebedee';
      const finalTex = curTexUrl || createFallbackTexture(defaultCol1, defaultCol2);
      const pat3DPath = get3DPatternPath(normalizedShape, curPatId);
      const wingMats = createWingMaterials(finalTex, pat3DPath);
      const bodyMat = createBodyMaterial(finalTex, curBodyColor);
      const cleanAnt = String(targetAnt || 'ball').split('__')[0] || 'ball';
      const targetAntPrefix = 'Antenna_' + cleanAnt;

      const gltfLoader = new THREE.GLTFLoader();
      const modelPath = './3DButterfly/' + normalizedShape + '.glb';

      gltfLoader.load(
        modelPath,
        function(gltf) {
          if (loadingIndicator) loadingIndicator.style.display = 'none';
          const model = gltf.scene;
          model.traverse(function(child) {
            if (child.isMesh) {
              const n = child.name || '';
              if (n.indexOf('Wing_L') === 0 || n.startsWith('Wing_L')) {
                wingL = child;
                wingL.userData.baseRotX = child.rotation.x;
                wingL.userData.baseRotY = child.rotation.y;
                wingL.userData.baseRotZ = child.rotation.z;
                child.material = wingMats.matL;
              } else if (n.indexOf('Wing_R') === 0 || n.startsWith('Wing_R')) {
                wingR = child;
                wingR.userData.baseRotX = child.rotation.x;
                wingR.userData.baseRotY = child.rotation.y;
                wingR.userData.baseRotZ = child.rotation.z;
                child.material = wingMats.matR;
              } else if (n.indexOf('Body') === 0 || n.startsWith('Body')) {
                child.material = bodyMat;
              } else if (n.indexOf('Antenna_') === 0 || n.startsWith('Antenna_')) {
                child.material = bodyMat;
                // 선택된 안테나 타입만 보이도록 처리
                child.visible = n.startsWith(targetAntPrefix);
              }
            }
          });
          model.scale.set(1.25, 1.25, 1.25);
          model.position.set(0, 0, 0);
          group.add(model);
        },
        undefined,
        function(err) {
          console.error("GLTF 모델 로드 실패:", modelPath, err);
          if (loadingIndicator) {
            loadingIndicator.innerText = "나비 모델을 불러오지 못했습니다.";
          }
        }
      );
    }

    function applyDatabaseRow(data) {
      if (!data) return;
      if (data.name) butterflyName = sanitizeCleanText(data.name) || butterflyName;
      if (data.memo) memoText = sanitizeCleanText(data.memo) || memoText;
      if (data.wing_shape || data.shape) shape = normalizeButterflyShape(data.wing_shape || data.shape);
      if (data.pattern_id || data.pattern) patternId = data.pattern_id || data.pattern;
      const dbAntStr = String(data.antenna_type || data.antenna || antennaType);
      const dbAntParts = dbAntStr.split('__');
      antennaType = dbAntParts[0] || antennaType;
      bodyColor = data.body_color || dbAntParts[1] || bodyColor;
      if (data.texture_url || data.texture) {
        textureUrl = data.texture_url || data.texture;
      }
      updateUIElements();
    }

    async function loadButterflyData() {
      let loadedData = null;

      if (supabaseClient) {
        // 1차 시도: URL의 id 파라미터로 조회
        if (butterflyId) {
          try {
            const { data, error } = await supabaseClient
              .from('butterflies')
              .select('*')
              .eq('id', butterflyId)
              .maybeSingle();

            if (!error && data) {
              loadedData = data;
            }
          } catch (err) {
            console.warn("Supabase ID 조회 경고:", err);
          }
        }

        // 2차 시도(보조): 임시 ID였거나 ID로 찾지 못한 경우 나비 이름(name)으로 가장 최근 데이터 조회
        if (!loadedData && butterflyName && butterflyName !== "빛의 나비") {
          try {
            const { data: nameRows, error: nameErr } = await supabaseClient
              .from('butterflies')
              .select('*')
              .eq('name', butterflyName)
              .order('id', { ascending: false })
              .limit(1);

            if (!nameErr && Array.isArray(nameRows) && nameRows.length > 0) {
              loadedData = nameRows[0];
            }
          } catch (err2) {
            console.warn("Supabase 이름 보조 조회 경고:", err2);
          }
        }
      }

      if (loadedData) {
        applyDatabaseRow(loadedData);
      } else {
        updateUIElements();
      }

      build3DModel(shape, antennaType, textureUrl, patternId, bodyColor);
    }
    loadButterflyData();

    // 렌더링 루프
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const flap = 0.30 + Math.sin(t * 2.8) * 0.65;

      if (!isUserDragging) {
        butterflyRotX += (DEFAULT_ROT_X - butterflyRotX) * 0.05;
        const diffY = (DEFAULT_ROT_Y - butterflyRotY);
        butterflyRotY += Math.atan2(Math.sin(diffY), Math.cos(diffY)) * 0.05;
      }
      group.rotation.x = butterflyRotX;
      group.rotation.y = butterflyRotY;
      group.rotation.z = 0;

      if (wingL && wingR) {
        const uL = wingL.userData;
        const uR = wingR.userData;
        wingL.rotation.set(uL.baseRotX || 0, (uL.baseRotY || 0) + flap, uL.baseRotZ || 0);
        wingR.rotation.set(uR.baseRotX || 0, (uR.baseRotY || 0) - flap, uR.baseRotZ || 0);
      }

      group.position.y = Math.sin(t * 2.0) * 0.08;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', function() {
      const rw = container.clientWidth || 320;
      const rh = container.clientHeight || 360;
      camera.aspect = rw / rh;
      camera.updateProjectionMatrix();
      renderer.setSize(rw, rh);
    });
  </script>
</body>
