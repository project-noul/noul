<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOUL : Luminous Space</title>

  <!-- 파비콘 (브라우저 탭 아이콘) 설정: 상위/현재 폴더 경로 자동 탐색 및 캐시 즉시 갱신 -->
  <link id="favicon-link" rel="icon" type="image/png" href="../image/cover-bg.png">
  <link id="apple-icon-link" rel="apple-touch-icon" href="../image/cover-bg.png">
  <script>
    (function() {
      var candidatePaths = [
        '../image/cover-bg.png',
        'image/cover-bg.png',
        './image/cover-bg.png',
        '../index/image/cover-bg.png',
        '../../image/cover-bg.png',
        'cover-bg.png',
        '../image/cover-bg.jpg',
        'image/cover-bg.jpg'
      ];
      var idx = 0;
      function tryNextFavicon() {
        if (idx >= candidatePaths.length) return;
        var path = candidatePaths[idx++];
        var img = new Image();
        img.onload = function() {
          var fav = document.getElementById('favicon-link');
          var appFav = document.getElementById('apple-icon-link');
          var finalHref = path;
          try {
            var c = document.createElement('canvas');
            c.width = 64;
            c.height = 64;
            var ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0, 64, 64);
            finalHref = c.toDataURL('image/png');
          } catch (e) {
            finalHref = path + '?v=' + Date.now();
          }
          if (fav) fav.href = finalHref;
          if (appFav) appFav.href = finalHref;
        };
        img.onerror = tryNextFavicon;
        img.src = path;
      }
      tryNextFavicon();
    })();
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000000; user-select: none; cursor: none; overscroll-behavior: none; touch-action: none; font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, sans-serif; }
    #webcam-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1) translateZ(0); z-index: 0; pointer-events: none; opacity: 0.28; will-change: transform; contain: strict; }
    #video-dark-overlay { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0.78) 60%, rgba(0, 0, 0, 0.96) 100%); z-index: 1; pointer-events: none; contain: strict; }
    #three-canvas-container { position: absolute; inset: 0; z-index: 10; transform: translateZ(0); will-change: transform; contain: strict; }
    #hand-pointer { position: absolute; top: 0; left: 0; width: 52px; height: 52px; border-radius: 50%; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.25); pointer-events: none; z-index: 30; opacity: 0; transition: opacity 0.2s ease; will-change: transform, opacity; contain: layout style; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; }
    #hand-pointer::after { content: ''; width: 20px; height: 20px; border-radius: 50%; background: rgba(255, 255, 255, 0.5); border: 1px solid rgba(255, 255, 255, 0.8); }
    /* 1단계: 고민 안내 카드 */
    #floating-concern-card { position: absolute; top: 0; left: 0; width: 290px; min-height: 140px; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; z-index: 42; opacity: 0; transition: opacity 0.35s ease; will-change: transform, opacity; contain: layout style; backface-visibility: hidden; }
    #floating-concern-card::before { content: ''; position: absolute; inset: -45px; background: radial-gradient(ellipse 60% 55% at 50% 50%, rgba(10, 10, 10, 0.98) 0%, rgba(10, 10, 10, 0.92) 25%, rgba(10, 10, 10, 0.70) 45%, rgba(10, 10, 10, 0.35) 65%, rgba(10, 10, 10, 0.10) 82%, rgba(0, 0, 0, 0) 100%); z-index: -1; border-radius: 50%; }
    #floating-concern-card.visible { opacity: 1; }
    .concern-badge-tag { display: inline-block; color: #ffffff; font-size: 26px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 6px; z-index: 2; }
    #floating-concern-reason { font-size: 20px; font-weight: 500; line-height: 1.5; color: #f0f0f0; word-break: keep-all; z-index: 2; min-height: 42px; }
    /* 2단계: 다정한 한마디 카드 */
    #floating-info-card { position: absolute; top: 0; left: 0; width: 290px; min-height: 140px; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; z-index: 40; opacity: 0; transition: opacity 0.35s ease; will-change: transform, opacity; contain: layout style; backface-visibility: hidden; }
    #floating-info-card::before { content: ''; position: absolute; inset: -45px; background: radial-gradient(ellipse 60% 55% at 50% 50%, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.90) 25%, rgba(255, 255, 255, 0.65) 45%, rgba(255, 255, 255, 0.30) 65%, rgba(255, 255, 255, 0.08) 82%, rgba(255, 255, 255, 0) 100%); z-index: -1; border-radius: 50%; }
    #floating-info-card.visible { opacity: 1; }
    #floating-butterfly-name { font-size: 25px; font-weight: 800; letter-spacing: -0.3px; color: #080808; margin-bottom: 5px; z-index: 2; text-align: center; }
    #floating-butterfly-memo { font-size: 19.5px; font-weight: 600; line-height: 1.45; color: #1a1a1a; word-break: keep-all; z-index: 2; min-height: 42px; text-align: center; }
    .typing-cursor { display: inline-block; width: 2px; height: 1em; vertical-align: middle; background-color: currentColor; margin-left: 2px; animation: cursorBlink 0.75s infinite; }
    @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    #gesture-notice-top { position: absolute; bottom: 7.4rem; left: 50%; transform: translateX(-50%); z-index: 50; pointer-events: none; font-size: 20px; font-weight: 600; color: #ffffff; letter-spacing: -0.2px; white-space: nowrap; text-shadow: 0 0 8px rgba(255, 255, 255, 0.85), 0 0 18px rgba(255, 255, 255, 0.55), 0 1px 6px rgba(0, 0, 0, 0.9); will-change: transform; }
    #gesture-guide-banner { position: absolute; bottom: 3.2rem; left: 50%; transform: translateX(-50%); z-index: 50; pointer-events: none; display: flex; align-items: center; justify-content: center; gap: 1.8rem; padding: 0.5rem 1.0rem; background: transparent !important; border: none !important; border-radius: 0 !important; box-shadow: none !important; white-space: nowrap; will-change: transform; }
    .guide-banner-item { display: flex; align-items: center; gap: 0.6rem; font-size: 20px; color: #e5e5e5; letter-spacing: -0.2px; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9); }
    .guide-banner-item strong { color: #ffffff; font-weight: 700; }
    .guide-banner-divider { width: 1px; height: 19px; background: rgba(255, 255, 255, 0.28); }
  </style>
</head>
<body>

  <video id="webcam-video" playsinline autoplay muted></video>
  <div id="video-dark-overlay"></div>
  <div id="three-canvas-container"></div>
  <div id="hand-pointer"></div>

  <!-- 1단계: 고민 안내 카드 -->
  <div id="floating-concern-card">
    <div id="floating-concern-tag" class="concern-badge-tag">#완벽주의 강박</div>
    <div id="floating-concern-reason"></div>
  </div>

  <!-- 2단계: 다정한 한마디 카드 -->
  <div id="floating-info-card">
    <div id="floating-butterfly-name">‘나비’</div>
    <div id="floating-butterfly-memo"></div>
  </div>

  <!-- 상단 1인 체험 안내 문구 -->
  <div id="gesture-notice-top">원활한 제스처 인식을 위해 한 번에 한 분만 손을 비춰주세요.</div>

  <!-- 하단 안내 배너 -->
  <aside id="gesture-guide-banner">
    <div class="guide-banner-item">
      <span>👉</span>
      <span><strong>손가락 하나</strong> 나비가 손끝에 내려앉아요.</span>
    </div>
    <div class="guide-banner-divider"></div>
    <div class="guide-banner-item">
      <span>✊</span>
      <span><strong>주먹을 쥐면</strong> 나비들이 곁으로 모여들어요.</span>
    </div>
    <div class="guide-banner-divider"></div>
    <div class="guide-banner-item">
      <span>🖐️</span>
      <span><strong>손을 펼치면</strong> 나비들이 흩어져 날아가요.</span>
    </div>
  </aside>

  <!-- 분리된 스크립트 파일 로드 -->
  <script src="./display-core.js"></script>
  <script src="./display-motion.js"></script>
</body>
</html>
